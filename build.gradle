// Every project is built with Architectury Loom, the Loom fork that builds both Fabric and Forge mods.
// A project's platform comes from `loom.platform` in its gradle.properties (forge/gradle.properties);
// without it the project is a Fabric-style project (common and fabric).
plugins {
	id 'dev.architectury.loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'dev.architectury.loom'

	version = rootProject.version
	group = rootProject.group
	base {
		archivesName = "${rootProject.archives_base_name}-${project.name}"
	}

	loom {
		silentMojangMappingsLicense()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		// Mojang's official names everywhere: the one naming both Fabric (remapped to intermediary)
		// and Forge (remapped to SRG) can be built from.
		mappings loom.officialMojangMappings()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
		it.options.release = 17
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}
}

// The loader projects compile against common's named classes and bundle them into their jar,
// so each shipped jar is one self-contained mod.
configure([project(':fabric'), project(':forge')]) {
	dependencies {
		implementation(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	}

	loom {
		mods {
			"qccore" {
				sourceSet sourceSets.main
				sourceSet 'main', ':common'
			}
		}
	}

	tasks.named('compileJava') {
		dependsOn ':common:classes'
	}

	jar {
		from(project(':common').sourceSets.main.output)
		from(rootProject.file('LICENSE')) {
			rename { "${it}_qccore" }
		}
	}

	sourcesJar {
		from(project(':common').sourceSets.main.allSource)
	}
}
