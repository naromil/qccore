pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'qccore'

// common: the loader-neutral mod (Mojang names, no loader API) plus the JUnit tests.
// fabric / forge: the loader glue; each one's remapJar bundles the common classes into one mod jar.
include 'common', 'fabric', 'forge'
